<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>WebOlla Pro - Final Build</title>
  <style>
    :root { --bg: #f8f9fa; --nav-bg: #1a1c1e; --aside-bg: #fff; --text: #212529; --primary: #0d6efd; --border: #dee2e6; --bot: #f1f3f5; --user: #0d6efd; }
    body.dark { --bg: #121212; --nav-bg: #000; --aside-bg: #1e1e1e; --text: #e0e0e0; --primary: #3d8bfd; --border: #333; --bot: #2c2c2c; --user: #0d6efd; }
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }
    nav { width: 70px; background: var(--nav-bg); display: flex; flex-direction: column; align-items: center; padding: 20px 0; flex-shrink: 0; }
    .nav-btn { background: none; border: none; color: #fff; font-size: 1.5rem; margin-bottom: 25px; cursor: pointer; opacity: 0.6; padding: 10px; border-radius: 8px; }
    .nav-btn.active { opacity: 1; background: rgba(255,255,255,0.1); }
    #layout { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header { height: 55px; background: var(--aside-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    #content-area { flex: 1; display: flex; overflow: hidden; }
    main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    #chat-scroll { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; }
    .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .user { align-self: flex-end; background: var(--user); color: white; }
    aside { width: 330px; background: var(--aside-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 20px; }
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
    .btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--primary); color: white; cursor: pointer; }
    .btn-stop { background: #dc3545; display: none; }
    #overlay { display: none; position: absolute; inset: 0; background: var(--aside-bg); z-index: 50; padding: 30px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body class="dark">
<nav>
  <button class="nav-btn active" onclick="showView('chat')">💬</button>
  <button class="nav-btn" onclick="showView('models')">📦</button>
</nav>
<div id="layout">
  <header>
    <div id="hw-bar" style="color:#28a745; font-family:monospace; font-size:0.8rem;">Hardware: Idle</div>
    <button class="btn" style="background:transparent; color:var(--text);" onclick="document.body.classList.toggle('dark')">🌓</button>
  </header>
  <div id="content-area">
    <main>
      <div id="chat-scroll"></div>
      <div id="overlay">
        <div style="display:flex; justify-content:space-between;"><h2>Model Manager</h2><button class="btn" onclick="showView('chat')">✕</button></div>
        <div class="card">
          <h4>Installed Models</h4>
          <table id="model-table"><thead><tr><th>Name</th><th>Size</th><th>Action</th></tr></thead><tbody id="model-list-body"></tbody></table>
        </div>
        <div class="card">
          <h4>Marketplace</h4>
          <div id="market-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px;"></div>
        </div>
      </div>
      <footer style="padding:20px; border-top:1px solid var(--border); background:var(--aside-bg);">
        <div style="display:flex; gap:10px;">
          <textarea id="prompt" rows="1" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);" placeholder="Ask anything..."></textarea>
          <button id="send-btn" class="btn" onclick="generate()">Send</button>
          <button id="stop-btn" class="btn btn-stop" onclick="stopGen()">Stop</button>
        </div>
        <div style="margin-top:10px;">
          Model: <select id="model-select" style="padding:4px;"></select>
        </div>
      </footer>
    </main>
    <aside>
      <div class="card"><h4>Knowledge Base</h4><div id="file-list">None.</div><button class="btn" onclick="document.getElementById('fIn').click()">+ Upload</button><input type="file" id="fIn" multiple hidden onchange="upload()"></div>
      <div class="card"><h4>Tuning</h4>
        Temp: <input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.7"><br>
        Ctx: <input type="number" id="ctx" value="4096" style="width:100%;">
      </div>
    </aside>
  </div>
</div>
<script>
let chatHistory = [];
let abortController = null;
const lib = [{id:"llama3.2:1b",name:"Llama 3.2 1B"},{id:"llama3.2:3b",name:"Llama 3.2 3B"},{id:"mistral",name:"Mistral 7B"}];

function showView(v) { 
    document.getElementById('overlay').style.display = v==='models'?'block':'none'; 
    if(v==='models') loadModels(); 
}

async function loadModels() {
  const res = await fetch("/api/models");
  const data = await res.json();
  const installed = (data.models || []).map(m => m.name);
  
  const sel = document.getElementById("model-select");
  sel.innerHTML = "";
  const tableBody = document.getElementById("model-list-body");
  tableBody.innerHTML = "";

  (data.models || []).forEach(m => {
    sel.innerHTML += `<option value="${m.name}">${m.name}</option>`;
    tableBody.innerHTML += `<tr><td>${m.name}</td><td>${(m.size/1e9).toFixed(1)}GB</td><td><button class="btn" style="background:#dc3545" onclick="deleteMod('${m.name}')">Delete</button></td></tr>`;
  });

  const grid = document.getElementById("market-grid");
  grid.innerHTML = lib.map(m => {
    const isReady = installed.includes(m.id) || installed.includes(m.id+":latest");
    return `<div class="card"><strong>${m.name}</strong><br><button class="btn" style="width:100%; margin-top:10px; ${isReady?'background:#6c757d':''}" onclick="${isReady?'':'pull(\''+m.id+'\')'}">${isReady?'Ready':'Install'}</button></div>`;
  }).join('');
}

async function generate() {
  const pInput = document.getElementById("prompt");
  const text = pInput.value.trim(); if(!text) return;
  
  abortController = new AbortController();
  document.getElementById("stop-btn").style.display = "inline-block";
  document.getElementById("send-btn").style.display = "none";

  const win = document.getElementById("chat-scroll");
  win.innerHTML += `<div class="msg user">${text}</div>`;
  chatHistory.push({role:"user", content:text});
  pInput.value = ""; win.scrollTop = win.scrollHeight;

  const botMsg = document.createElement("div"); botMsg.className="msg bot"; botMsg.innerText="...";
  win.appendChild(botMsg);

  try {
    const res = await fetch("/api/generate", {
      method:"POST", signal: abortController.signal,
      body: JSON.stringify({
        model: document.getElementById("model-select").value,
        messages: chatHistory,
        options: { temperature: parseFloat(document.getElementById("temp").value), num_ctx: parseInt(document.getElementById("ctx").value) }
      })
    });

    const reader = res.body.getReader();
    let fullText = "";
    while(true) {
      const {done, value} = await reader.read();
      if(done) break;
      new TextDecoder().decode(value).split("\n").forEach(l => {
        if(l.startsWith("data: ")) {
          try {
            const j = JSON.parse(l.substring(6));
            if(j.message) {
              // FIX: Clean up <unused> tokens
              let clean = j.message.content.replace(/<unused\d+>/g, '');
              fullText += clean; botMsg.innerText = fullText;
            }
          } catch(e){}
        }
      });
      win.scrollTop = win.scrollHeight;
    }
    chatHistory.push({role:"assistant", content:fullText});
  } catch(e) { if(e.name === 'AbortError') botMsg.innerText += " [Stopped]"; }
  
  document.getElementById("stop-btn").style.display = "none";
  document.getElementById("send-btn").style.display = "inline-block";
}

function stopGen() { if(abortController) abortController.abort(); }

async function deleteMod(name) {
  if(confirm("Delete " + name + "?")) {
    await fetch("/api/delete", {method:"DELETE", body:JSON.stringify({name})});
    loadModels();
  }
}

async function pull(name) {
  alert("Downloading " + name);
  await fetch("/api/pull", {method:"POST", body:JSON.stringify({name})});
  loadModels();
}

async function upload() {
  const fd = new FormData();
  [...document.getElementById("fIn").files].forEach(f => fd.append("files", f));
  await fetch("/api/upload", {method:"POST", body:fd});
  const fl = await (await fetch("/api/files")).json();
  document.getElementById("file-list").innerText = fl.join(", ");
}

async function updateHW() {
  try {
    const res = await fetch("/api/telemetry");
    const data = await res.json();
    const bar = document.getElementById("hw-bar");
    if(!data.models || data.models.length === 0) { bar.innerText = "Hardware: Idle"; return; }
    const m = data.models[0];
    bar.innerText = `Active: ${m.name} | VRAM: ${(m.size_vram/1e9).toFixed(1)}GB`;
  } catch(e) {}
}

// Install a model with live progress
async function pull(name) {
    const statusDiv = document.getElementById("hw-bar");
    statusDiv.style.color = "#ffc107"; // Warning yellow for downloading
    statusDiv.innerText = `Preparing download for ${name}...`;

    const res = await fetch("/api/pull", {
        method: "POST",
        body: JSON.stringify({ name })
    });

    const reader = res.body.getReader();
    while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const lines = new TextDecoder().decode(value).split("\n");
        lines.forEach(l => {
            if (l.startsWith("data: ")) {
                try {
                    const progress = JSON.parse(l.substring(6));
                    if (progress.status) {
                        statusDiv.innerText = `${name}: ${progress.status} ${progress.completed ? '(' + Math.round((progress.completed/progress.total)*100) + '%)' : ''}`;
                    }
                } catch (e) {}
            }
        });
    }
    
    statusDiv.style.color = "#28a745"; // Success green
    statusDiv.innerText = `Installed ${name} successfully!`;
    loadModels(); // Refresh the list
}

// Bulk File Upload
async function upload() {
    const fileInput = document.getElementById("fIn");
    const fd = new FormData();
    const files = [...fileInput.files];
    
    if (files.length === 0) return;
    files.forEach(f => fd.append("files", f));

    const listDiv = document.getElementById("file-list");
    listDiv.innerText = "Uploading...";

    await fetch("/api/upload", { method: "POST", body: fd });
    
    // Refresh the list from the server
    const fl = await (await fetch("/api/files")).json();
    listDiv.innerHTML = fl.map(f => `<div>📄 ${f}</div>`).join('');
}

setInterval(updateHW, 3000);
loadModels();
</script>
</body>
</html>
