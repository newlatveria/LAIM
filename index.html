<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>LAIM</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: auto; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .row { display: flex; gap: 20px; margin-bottom: 15px; }
    .col { flex: 1; }
    
    label { font-weight: 600; font-size: 0.9em; display: block; margin-bottom: 5px; color: #555; }
    select, input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    
    /* Temperature Slider */
    .range-wrap { display: flex; align-items: center; gap: 10px; }
    input[type=range] { flex: 1; }
    .val-badge { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-family: monospace; }

    pre { background: #2d2d2d; color: #f8f8f2; padding: 15px; border-radius: 4px; white-space: pre-wrap; min-height: 100px; }
    
    button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    button.secondary { background: #6c757d; }
    button.danger { background: #dc3545; }
  </style>
</head>
<body>

<h1>Local AI Manager</h1>

<div class="card">
  <div class="row">
    <div class="col">
      <label>Model Selection</label>
      <select id="models"></select>
    </div>
    <div class="col">
      <label>Temperature (Creativity)</label>
      <div class="range-wrap">
        <input type="range" id="temp" min="0" max="1" step="0.1" value="0.7" oninput="updateVal('temp-val', this.value)">
        <span id="temp-val" class="val-badge">0.7</span>
        <ul style="font-size: 0.8em; color: #666;">0.0 - 0.3: Use for coding, math, or factual Q&A.</ul>
        <ul style="font-size: 0.8em; color: #666;">0.7: Standard balance (default).</ul>
        <ul style="font-size: 0.8em; color: #666;">0.9 - 1.0: Use for creative writing or brainstorming.</ul>
      </div>
    </div>
  </div>

  <label>System Persona</label>
  <textarea id="system" rows="2" placeholder="e.g. You are a Python coding expert. Be concise."></textarea>
</div>

<div class="card">
  <pre id="output">Ready...</pre>
  <div class="row">
    <textarea id="prompt" rows="3" placeholder="Type message..."></textarea>
  </div>
  <button onclick="generate()">Send Message</button>
  <button class="danger" onclick="clearSession()" style="float: right;">Reset All</button>
</div>

<div class="card">
  <label>Knowledge Base (RAG)</label>
  <div class="row" style="align-items: flex-end;">
    <div class="col">
      <label>Select Files</label>
      <input type="file" id="files" multiple>
    </div>
    <div class="col">
      <label>Select Folder</label>
      <input type="file" id="folders" webkitdirectory multiple>
    </div>
    <div class="col">
      <button class="secondary" onclick="upload()">Upload Docs</button>
    </div>
  </div>
  <p style="font-size: 0.8em; color: #666;">Supported: .txt, .md, .csv, .json (Images/PDFs require OCR setup)</p>
</div>

<script>
let chatHistory = [];
const updateVal = (id, v) => document.getElementById(id).textContent = v;

async function loadModels() {
  try {
    const res = await fetch("/api/models");
    const data = await res.json();
    const sel = document.getElementById("models");
    (data.models || []).forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.name;
      opt.textContent = m.name;
      sel.appendChild(opt);
    });
  } catch(e) { console.error(e); }
}

async function generate() {
  const prompt = document.getElementById("prompt").value.trim();
  const output = document.getElementById("output");
  if (!prompt) return;

  chatHistory.push({role: "user", content: prompt});
  document.getElementById("prompt").value = "";
  output.textContent = "Thinking...";

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      body: JSON.stringify({
        model: document.getElementById("models").value,
        system: document.getElementById("system").value,
        messages: chatHistory,
        options: {
          temperature: parseFloat(document.getElementById("temp").value)
        }
      })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = "";
    output.textContent = "";

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split("\n");
      for (const line of lines) {
        if (line.startsWith("data: ")) {
            try {
                const json = JSON.parse(line.substring(6));
                if (json.message?.content) {
                    fullText += json.message.content;
                    output.textContent = fullText;
                }
            } catch (e) {}
        }
      }
    }
    chatHistory.push({role: "assistant", content: fullText});
  } catch (e) {
    output.textContent = "Error: " + e.message;
  }
}

async function upload() {
  const data = new FormData();
  // Append individual files
  for (const f of document.getElementById("files").files) data.append("files", f);
  // Append folder contents
  for (const f of document.getElementById("folders").files) data.append("files", f);

  if (data.getAll("files").length === 0) return alert("Please select files first");

  await fetch("/api/upload", { method: "POST", body: data });
  alert("Upload complete! These files are now in the model's context.");
}

async function clearSession() {
  await fetch("/api/reindex");
  chatHistory = [];
  document.getElementById("output").textContent = "Session cleared.";
}

loadModels();
</script>
</body>
</html>
