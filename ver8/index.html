<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><title>WebOlla Ultimate Build</title>
  <style>
    :root { --bg: #f8f9fa; --nav-bg: #1a1c1e; --aside-bg: #fff; --text: #212529; --primary: #0d6efd; --border: #dee2e6; --bot: #f1f3f5; --user: #0d6efd; }
    body.dark { --bg: #121212; --nav-bg: #000; --aside-bg: #1e1e1e; --text: #e0e0e0; --primary: #3d8bfd; --border: #333; --bot: #2c2c2c; --user: #0d6efd; }
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }
    nav { width: 70px; background: var(--nav-bg); display: flex; flex-direction: column; align-items: center; padding: 20px 0; flex-shrink: 0; }
    .nav-btn { background: none; border: none; color: #fff; font-size: 1.5rem; margin-bottom: 25px; cursor: pointer; opacity: 0.6; padding: 10px; border-radius: 8px; }
    .nav-btn.active { opacity: 1; background: rgba(255,255,255,0.1); }
    #layout { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header { height: 55px; background: var(--aside-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    #content-area { flex: 1; display: flex; overflow: hidden; }
    main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    #chat-scroll { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; white-space: pre-wrap; }
    .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .user { align-self: flex-end; background: var(--user); color: white; }
    aside { width: 330px; background: var(--aside-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 20px; }
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
    h4 { margin: 0 0 10px 0; font-size: 0.7rem; text-transform: uppercase; color: #888; }
    .btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--primary); color: white; cursor: pointer; font-size: 0.8rem; }
    .btn-stop { background: #dc3545; display: none; }
    #overlay { display: none; position: absolute; inset: 0; background: var(--aside-bg); z-index: 50; padding: 30px; overflow-y: auto; }
    input[type="range"] { width: 100%; margin: 8px 0; }
    textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; box-sizing: border-box; }
  </style>
</head>
<body class="dark">
<nav>
  <button class="nav-btn active" id="btn-chat" onclick="showView('chat')">💬</button>
  <button class="nav-btn" id="btn-mods" onclick="showView('models')">📦</button>
</nav>
<div id="layout">
  <header>
    <div id="hw-bar" style="color:#28a745; font-family:monospace; font-size:0.8rem;">Hardware: Idle</div>
    <button class="btn" style="background:transparent; color:var(--text);" onclick="document.body.classList.toggle('dark')">🌓 Theme</button>
  </header>
  <div id="content-area">
    <main>
      <div id="chat-scroll"><div class="msg bot">System ready. File injection and advanced tuning active.</div></div>
      <div id="overlay">
        <div style="display:flex; justify-content:space-between;"><h2>Model Manager</h2><button class="btn" onclick="showView('chat')">✕ Close</button></div>
        <div class="card">
          <h4>Marketplace & Import</h4>
          <div class="card">
          <h4>Installed</h4>
          <div id="model-list"></div>
        </div>
  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <button class="btn" style="flex:1; background:#343a40;" onclick="window.open('https://ollama.com/library', '_blank')">
      🌐 Browse Ollama
    </button>
    <button class="btn" style="flex:1; background:#FFD21E; color:black;" onclick="window.open('https://huggingface.co/models?library=gguf', '_blank')">
      🤗 Hugging Face
    </button>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:15px;">
    <input type="text" id="custom-model" placeholder="e.g. deepseek-coder:6.7b" 
           style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
    <button class="btn" onclick="pullCustom()">Install</button>
  </div>

  <h4 style="margin-top:0;">Quick Picks</h4>
  <div id="market-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px;"></div>
        </div>
        
      </div>
      <footer style="padding:20px; border-top:1px solid var(--border); background:var(--aside-bg);">
        <div style="display:flex; gap:10px;">
          <textarea id="prompt" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); generate();}"></textarea>
          <button id="send-btn" class="btn" onclick="generate()">Send</button>
          <button id="stop-btn" class="btn btn-stop" onclick="stopGen()">Stop</button>
        </div>
        <div style="margin-top:10px; display:flex; gap:15px; align-items:center;">
          <select id="model-select" style="padding:4px;"></select>
          <button class="btn" style="background:#6c757d" onclick="chatHistory=[]; document.getElementById('chat-scroll').innerHTML=''">Clear Chat</button>
        </div>
      </footer>
    </main>
    <aside>
      <div class="card">
        <h4>Knowledge Base</h4>
        <div id="file-list" style="font-size:0.8rem; margin-bottom:10px; max-height:100px; overflow-y:auto;">None.</div>
        <div style="display:flex; gap:5px;">
          <button class="btn" onclick="document.getElementById('fIn').click()">+ Files</button>
          <button class="btn" style="background:#dc3545" onclick="clearFiles()">Reset</button>
        </div>
        <input type="file" id="fIn" multiple hidden onchange="upload()">
      </div>
      <div class="card">
        <h4>System Persona</h4>
        <textarea id="system" rows="3" placeholder="You are a helpful assistant...">You are a helpful, professional assistant. Provide accurate and concise answers.</textarea>
      </div>
      <div class="card">
        <h4>Advanced Tuning</h4>
        <label>Temp: <span id="v-temp">0.7</span></label><input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.7" oninput="document.getElementById('v-temp').innerText=this.value">
        <label>Top-P: <span id="v-p">0.9</span></label><input type="range" id="top_p" min="0" max="1" step="0.05" value="0.9" oninput="document.getElementById('v-p').innerText=this.value">
        <label>Top-K: <span id="v-k">40</span></label><input type="range" id="top_k" min="0" max="100" step="1" value="40" oninput="document.getElementById('v-k').innerText=this.value">
        <label>Context: <span id="v-ctx">4096</span></label><input type="range" id="ctx" min="2048" max="32768" step="1024" value="4096" oninput="document.getElementById('v-ctx').innerText=this.value">
      </div>
    </aside>
  </div>
</div>

<script>
let chatHistory = [];
let abortController = null;
const lib = [{id:"llama3.2:1b",name:"Llama 3.2 1B"},{id:"llama3.2:3b",name:"Llama 3.2 3B"},{id:"mistral",name:"Mistral 7B"},{id:"gemma3:4b",name:"Gemma 3 4B"}];

function showView(v) { 
    document.getElementById('overlay').style.display = v==='models'?'block':'none';
    document.getElementById('btn-chat').classList.toggle('active', v==='chat');
    document.getElementById('btn-mods').classList.toggle('active', v==='models');
    if(v==='models') loadModels(); 
}

async function loadModels() {
  const res = await fetch("/api/models");
  const data = await res.json();
  const installed = (data.models || []).map(m => m.name);
  
  document.getElementById("model-select").innerHTML = (data.models || []).map(m => `<option value="${m.name}">${m.name}</option>`).join('');
  document.getElementById("model-list").innerHTML = (data.models || []).map(m => `
    <div style="display:flex; justify-content:space-between; margin-bottom:5px; background:var(--aside-bg); padding:8px; border-radius:5px;">
      <span>${m.name}</span> <button class="btn" style="background:#dc3545" onclick="deleteMod('${m.name}')">Del</button>
    </div>`).join('');

  document.getElementById("market-grid").innerHTML = lib.map(m => {
    const isReady = installed.includes(m.id) || installed.includes(m.id+":latest");
    return `<div class="card" style="text-align:center;"><strong>${m.name}</strong><br><button class="btn" style="width:100%; margin-top:10px; ${isReady?'background:#6c757d':''}" onclick="${isReady?'':'pull(\''+m.id+'\')'}">${isReady?'Installed':'Install'}</button></div>`;
  }).join('');
}

async function generate() {
  const pInput = document.getElementById("prompt");
  const text = pInput.value.trim(); if(!text) return;
  
  abortController = new AbortController();
  document.getElementById("stop-btn").style.display = "inline-block";
  document.getElementById("send-btn").style.display = "none";

  const win = document.getElementById("chat-scroll");
  win.innerHTML += `<div class="msg user">${text}</div>`;
  chatHistory.push({role:"user", content:text});
  pInput.value = ""; win.scrollTop = win.scrollHeight;

  const botMsg = document.createElement("div"); botMsg.className="msg bot"; botMsg.innerText="...";
  win.appendChild(botMsg);

  try {
    const res = await fetch("/api/generate", {
      method:"POST", signal: abortController.signal,
      body: JSON.stringify({
        model: document.getElementById("model-select").value,
        system: document.getElementById("system").value,
        messages: chatHistory,
        options: { 
          temperature: parseFloat(document.getElementById("temp").value),
          top_p: parseFloat(document.getElementById("top_p").value),
          top_k: parseInt(document.getElementById("top_k").value),
          num_ctx: parseInt(document.getElementById("ctx").value)
        }
      })
    });

    const reader = res.body.getReader();
    let fullText = "";
    while(true) {
      const {done, value} = await reader.read();
      if(done) break;
      new TextDecoder().decode(value).split("\n").forEach(l => {
        if(l.startsWith("data: ")) {
          try {
            const j = JSON.parse(l.substring(6));
            if(j.message) {
              fullText += j.message.content.replace(/<unused\d+>/g, '');
              botMsg.innerText = fullText;
            }
          } catch(e){}
        }
      });
      win.scrollTop = win.scrollHeight;
    }
    chatHistory.push({role:"assistant", content:fullText});
  } catch(e) { if(e.name === 'AbortError') botMsg.innerText += " [STOPPED]"; }
  
  document.getElementById("stop-btn").style.display = "none";
  document.getElementById("send-btn").style.display = "inline-block";
}

function stopGen() { if(abortController) abortController.abort(); }

async function deleteMod(name) {
  if(confirm("Delete " + name + "?")) { await fetch("/api/delete", {method:"DELETE", body:JSON.stringify({name})}); loadModels(); }
}

async function pull(name) {
  const bar = document.getElementById("hw-bar");
  bar.innerText = "Downloading " + name + "...";
  const res = await fetch("/api/pull", {method:"POST", body:JSON.stringify({name})});
  const reader = res.body.getReader();
  while(true) {
    const {done, value} = await reader.read();
    if(done) break;
    new TextDecoder().decode(value).split("\n").forEach(l => {
      if(l.startsWith("data: ")) {
        const j = JSON.parse(l.substring(6));
        if(j.status) bar.innerText = `${name}: ${j.status}`;
      }
    });
  }
  loadModels();
}

async function upload() {
  const fd = new FormData();
  [...document.getElementById("fIn").files].forEach(f => fd.append("files", f));
  await fetch("/api/upload", {method:"POST", body:fd});
  const fl = await (await fetch("/api/files")).json();
  document.getElementById("file-list").innerHTML = fl.map(f => `<div>📄 ${f}</div>`).join('');
}

async function clearFiles() {
  await fetch("/api/reindex", {method:"POST"});
  document.getElementById("file-list").innerText = "None.";
}

async function updateHW() {
  try {
    const res = await fetch("/api/telemetry");
    const data = await res.json();
    const bar = document.getElementById("hw-bar");
    if(!data.models || data.models.length === 0) { bar.innerText = "Hardware: Idle"; return; }
    const m = data.models[0];
    bar.innerText = `Active: ${m.name} | VRAM: ${(m.size_vram/1e9).toFixed(1)}GB`;
  } catch(e) {}
}

async function pullCustom() {
  const name = document.getElementById("custom-model").value.trim();
  if (!name) return alert("Please enter a model name (e.g., llama3)");
  
  // Clear input
  document.getElementById("custom-model").value = "";
  
  // Trigger the existing pull logic
  await pull(name);
}

setInterval(updateHW, 3000);
loadModels();
</script>
</body>
</html>
