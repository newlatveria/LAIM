<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>LAIM V5</title>
  <style>
    :root { --sidebar: #1a1c1e; --panel: #f8f9fa; --primary: #007bff; }
    body { font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; background: #eee; overflow: hidden; }
    
    /* Sidebar */
    #nav { width: 70px; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; padding: 20px 0; color: white; flex-shrink: 0; }
    .nav-btn { font-size: 1.5rem; margin-bottom: 25px; cursor: pointer; opacity: 0.6; }
    .nav-btn.active { opacity: 1; color: var(--primary); }

    /* Main Content Area */
    #main-view { flex: 1; display: flex; flex-direction: column; background: white; border-right: 1px solid #ddd; }
    #chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #fdfdfd; }
    
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.4; }
    .user { align-self: flex-end; background: var(--primary); color: white; }
    .bot { align-self: flex-start; background: #e9ecef; color: #333; }

    #input-box { padding: 20px; border-top: 1px solid #ddd; background: white; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; }

    /* Right Panel (Settings & Files) */
    #settings-panel { width: 320px; background: var(--panel); padding: 20px; overflow-y: auto; flex-shrink: 0; }
    .section { margin-bottom: 25px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; }
    h4 { margin: 0 0 10px 0; font-size: 0.8rem; color: #888; text-transform: uppercase; }
    
    .slider-row { margin-bottom: 12px; }
    .slider-row label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .file-pill { background: #eef2f7; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin: 2px; display: inline-block; border: 1px solid #d1d9e6; }
    
    /* Model Manager View */
    #models-view { display: none; padding: 30px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
    
    #progress-wrap { display: none; margin-top: 10px; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; }
    #progress-bar { height: 100%; background: #28a745; width: 0%; transition: 0.2s; }
  </style>
</head>
<body>

<div id="nav">
  <div class="nav-btn active" id="btn-chat" onclick="showView('chat')">💬</div>
  <div class="nav-btn" id="btn-models" onclick="showView('models')">📦</div>
</div>

<div id="main-view">
  <div id="chat-ui" style="flex: 1; display: flex; flex-direction: column;">
    <div id="chat-window">
        <div class="msg bot">Ready for your questions. Use the right panel to upload data or tweak parameters.</div>
    </div>
    <div id="input-box">
      <textarea id="prompt" rows="2" placeholder="Send a message..."></textarea>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button onclick="generate()" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Generate</button>
        <select id="model-select" style="flex: 1; padding: 8px; border-radius: 5px;"></select>
      </div>
    </div>
  </div>

  <div id="models-view">
    <h2>Model Management</h2>
    <div class="section">
      <h4>Install from Hugging Face / Ollama</h4>
      <div style="display:flex; gap:10px;">
        <input type="text" id="pull-name" placeholder="hf.co/bartowski/Llama-3.2-1B-Instruct-GGUF" style="flex:1; padding:10px;">
        <button onclick="pullModel()" style="padding:10px 20px; background:#28a745; color:white; border:none; border-radius:5px;">Pull</button>
      </div>
      <div id="progress-wrap"><div id="progress-bar"></div></div>
      <div id="status" style="font-size:0.8rem; margin-top:5px;"></div>
    </div>
    <table id="model-table">
      <thead><tr><th>Name</th><th>Size</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="settings-panel">
  <div class="section">
    <h4>Active Context (Files)</h4>
    <div id="file-list">No files in memory.</div>
    <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
    <label style="font-size:0.8rem; color:var(--primary); cursor:pointer;">
      + Upload Files/Folders
      <input type="file" id="fileInput" multiple style="display:none" onchange="upload()">
      <input type="file" id="folderInput" webkitdirectory multiple style="display:none" onchange="upload('folder')">
    </label>
    <div style="display:flex; gap:5px; margin-top:10px;">
        <button onclick="document.getElementById('fileInput').click()" style="font-size:0.7rem;">Files</button>
        <button onclick="document.getElementById('folderInput').click()" style="font-size:0.7rem;">Folders</button>
        <button onclick="clearContext()" style="font-size:0.7rem; background:#dc3545; color:white; border:none;">Clear</button>
    </div>
  </div>

  <div class="section">
    <h4>Parameters</h4>
    <div class="slider-row">
      <label>Temperature <b id="temp-val">0.7</b></label>
      <input type="range" id="temp" min="0" max="1.5" step="0.1" value="0.7" oninput="document.getElementById('temp-val').innerText=this.value">
    </div>
    <div class="slider-row">
      <label>Top-P <b id="p-val">0.9</b></label>
      <input type="range" id="top_p" min="0" max="1" step="0.05" value="0.9" oninput="document.getElementById('p-val').innerText=this.value">
    </div>
    <div class="slider-row">
      <label>Top-K <b id="k-val">40</b></label>
      <input type="range" id="top_k" min="0" max="100" step="1" value="40" oninput="document.getElementById('k-val').innerText=this.value">
    </div>
    <div class="slider-row">
      <label>Repeat Penalty <b id="rp-val">1.1</b></label>
      <input type="range" id="rp" min="1" max="2" step="0.1" value="1.1" oninput="document.getElementById('rp-val').innerText=this.value">
    </div>
    <label style="font-size:0.8rem;">System Instructions</label>
    <textarea id="system" rows="3" placeholder="You are a helpful assistant..."></textarea>
  </div>
</div>

<script>
let chatHistory = [];

function showView(view) {
    document.getElementById('chat-ui').style.display = view === 'chat' ? 'flex' : 'none';
    document.getElementById('models-view').style.display = view === 'models' ? 'block' : 'none';
    document.getElementById('btn-chat').classList.toggle('active', view === 'chat');
    document.getElementById('btn-models').classList.toggle('active', view === 'models');
    if(view === 'models') loadModels();
}

async function loadModels() {
    const res = await fetch("/api/models");
    const data = await res.json();
    const sel = document.getElementById("model-select");
    const tbody = document.querySelector("#model-table tbody");
    sel.innerHTML = ""; tbody.innerHTML = "";
    (data.models || []).forEach(m => {
        sel.innerHTML += `<option value="${m.name}">${m.name}</option>`;
        tbody.innerHTML += `<tr><td>${m.name}</td><td>${(m.size/1e9).toFixed(1)}GB</td><td><button onclick="deleteModel('${m.name}')">Del</button></td></tr>`;
    });
}

async function updateFiles() {
    const res = await fetch("/api/files");
    const files = await res.json();
    const list = document.getElementById("file-list");
    list.innerHTML = files?.length ? files.map(f => `<span class="file-pill">${f}</span>`).join('') : "Empty";
}

async function upload(type) {
    const fd = new FormData();
    const input = type === 'folder' ? document.getElementById("folderInput") : document.getElementById("fileInput");
    for (const f of input.files) fd.append("files", f);
    await fetch("/api/upload", { method: "POST", body: fd });
    updateFiles();
}

async function generate() {
    const p = document.getElementById("prompt");
    const text = p.value.trim();
    if(!text) return;
    
    // UI Update
    const win = document.getElementById("chat-window");
    win.innerHTML += `<div class="msg user">${text}</div>`;
    chatHistory.push({role: "user", content: text});
    p.value = "";
    
    const botMsg = document.createElement("div");
    botMsg.className = "msg bot";
    botMsg.innerText = "...";
    win.appendChild(botMsg);
    win.scrollTop = win.scrollHeight;

    const res = await fetch("/api/generate", {
        method: "POST",
        body: JSON.stringify({
            model: document.getElementById("model-select").value,
            system: document.getElementById("system").value,
            messages: chatHistory,
            options: {
                temperature: parseFloat(document.getElementById("temp").value),
                top_p: parseFloat(document.getElementById("top_p").value),
                top_k: parseInt(document.getElementById("top_k").value),
                repeat_penalty: parseFloat(document.getElementById("rp").value)
            }
        })
    });

    const reader = res.body.getReader();
    let fullText = "";
    while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        new TextDecoder().decode(value).split("\n").forEach(l => {
            if(l.startsWith("data: ")) {
                const j = JSON.parse(l.substring(6));
                if(j.message) { fullText += j.message.content; botMsg.innerText = fullText; }
            }
        });
        win.scrollTop = win.scrollHeight;
    }
    chatHistory.push({role: "assistant", content: fullText});
}

async function pullModel() {
    const name = document.getElementById("pull-name").value;
    document.getElementById("progress-wrap").style.display = "block";
    const res = await fetch("/api/pull", { method: "POST", body: JSON.stringify({name}) });
    const reader = res.body.getReader();
    while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        new TextDecoder().decode(value).split("\n").forEach(l => {
            if(l.startsWith("data: ")) {
                const j = JSON.parse(l.substring(6));
                document.getElementById("status").innerText = j.status;
                if(j.total) document.getElementById("progress-bar").style.width = (j.completed/j.total*100) + "%";
            }
        });
    }
    loadModels();
}

async function deleteModel(name) {
    if(confirm(`Delete ${name}?`)) {
        await fetch("/api/delete", { method: "POST", body: JSON.stringify({name}) });
        loadModels();
    }
}

async function clearContext() {
    await fetch("/api/reindex");
    updateFiles();
}

loadModels();
updateFiles();
</script>
</body>
</html>
