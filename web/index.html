<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>WebOlla – Helpful Generate</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: auto; }
    textarea { width: 100%; }
    pre { background: #f5f5f5; padding: 1em; }
  </style>
</head>
<body>

<h1>WebOlla</h1>

<h2>Generate</h2>

<label>Task</label>
<select id="task" onchange="recommend()">
  <option value="writing">Writing / Summarization</option>
  <option value="code">Code / Programming</option>
  <option value="reasoning">Reasoning / Q&A</option>
  <option value="fast">Fast / Lightweight</option>
  <option value="advanced">Advanced (show all)</option>
</select>

<p><em>Models are recommended based on task, but you can always choose any.</em></p>

<label>Model</label>
<select id="models"></select>

<br><br>
<textarea id="prompt" rows="6" placeholder="Enter prompt..."></textarea>
<br><br>
<button onclick="generate()">Generate</button>

<pre id="output"></pre>

<hr>

<h2>Upload Files / Folders</h2>
<input type="file" id="files" multiple>
<input type="file" id="folders" webkitdirectory multiple>
<br><br>
<button onclick="upload()">Upload</button>

<script>
let allModels = []

async function loadModels() {
  const res = await fetch("/api/models")
  const data = await res.json()
  allModels = data.models || []
  recommend()
}

function recommend() {
  const task = document.getElementById("task").value
  const sel = document.getElementById("models")
  sel.innerHTML = ""

  let filtered = allModels

  if (task === "code") {
    filtered = allModels.filter(m => m.name.includes("coder"))
  } else if (task === "fast") {
    filtered = allModels.filter(m =>
      m.details?.parameter_size &&
      parseFloat(m.details.parameter_size) <= 3
    )
  } else if (task === "advanced") {
    filtered = allModels
  }

  if (filtered.length === 0) filtered = allModels

  for (const m of filtered) {
    const o = document.createElement("option")
    o.value = m.name
    o.textContent = m.name
    sel.appendChild(o)
  }
}

async function generate() {
  const model = document.getElementById("models").value
  const prompt = document.getElementById("prompt").value

  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model, prompt })
  })

  document.getElementById("output").textContent = await res.text()
}

async function upload() {
  const data = new FormData()
  for (const f of files.files) data.append("files", f)
  for (const f of folders.files) data.append("files", f)

  await fetch("/api/upload", { method: "POST", body: data })
  alert("Upload complete")
}

loadModels()
</script>

</body>
</html>
